name: Firmware fil rouge - non regression

on:
  push:
    paths:
      - "firmware/**"
      - ".github/workflows/firmware-fil-rouge.yml"
  pull_request:
    paths:
      - "firmware/**"
      - ".github/workflows/firmware-fil-rouge.yml"
  workflow_dispatch:

jobs:
  tests-moteur-et-progression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verification obligatoire du contrat evolutif
        run: python3 firmware/tests/test_contrat_evolution.py
      - name: Acquis historiques M03 - M08
        run: python3 firmware/tests/test_progression.py
      - name: Compiler et executer les tests C++ du moteur M08
        run: |
          g++ -std=c++11 -Wall -Wextra -pedantic \
            firmware/tests/test_m08.cpp -o /tmp/test_m08
          /tmp/test_m08
      - name: Tests M09 - simulation et chronologie
        run: |
          python3 firmware/tests/test_m09_safety.py
          g++ -std=c++11 -Wall -Wextra -pedantic \
            firmware/tests/test_m09.cpp -o /tmp/test_m09
          /tmp/test_m09

  compilation-uno-simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Installer le coeur AVR Uno
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr
      - name: Compiler toutes les versions sur Uno (simulation)
        run: |
          set -e
          for sketch in firmware/etapes/M[0-9][0-9]/Compteur_M[0-9][0-9]; do
            if [ -d "$sketch" ]; then
              echo "Compilation Uno en simulation : $sketch"
              arduino-cli compile --fqbn arduino:avr:uno "$sketch"
            fi
          done
          arduino-cli compile --fqbn arduino:avr:uno firmware/courant/CompteurIntelligent
      - name: Compiler explicitement le mode ATmega328P autonome M09
        run: |
          arduino-cli compile --fqbn arduino:avr:uno \
            --build-property compiler.cpp.extra_flags="-DALEXTECH_ATMEGA_AUTONOME=1" \
            firmware/etapes/M09/Compteur_M09

  compilation-uno-materiel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Installer coeur AVR et bibliotheques materielles
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr
          arduino-cli lib update-index
          arduino-cli lib install PZEM004Tv30@1.2.1 RTClib hd44780
      - name: RTC et LCD reels avec PZEM simule
        run: |
          arduino-cli compile --fqbn arduino:avr:uno \
            --build-property compiler.cpp.extra_flags="-DALEXTECH_RTC_LCD_REELS=1" \
            firmware/courant/CompteurIntelligent
      - name: RTC, LCD et PZEM reels (compilation uniquement)
        run: |
          arduino-cli compile --fqbn arduino:avr:uno \
            --build-property compiler.cpp.extra_flags="-DALEXTECH_RTC_LCD_REELS=1 -DALEXTECH_PZEM_REEL=1" \
            firmware/courant/CompteurIntelligent
      - name: Interdire PZEM reel sans RTC reel
        run: |
          if arduino-cli compile --fqbn arduino:avr:uno \
            --build-property compiler.cpp.extra_flags="-DALEXTECH_PZEM_REEL=1 -DALEXTECH_RTC_LCD_REELS=0" \
            firmware/courant/CompteurIntelligent; then
            echo "ERREUR : melange horloge simulee / PZEM reel accepte"
            exit 1
          fi
          echo "PASS : mode PZEM reel sans RTC interdit"
